name: Packages

# Windows MSI only. Linux .deb / .rpm / Arch stay in arch-package.yml so a
# release tag does not build the same Linux packages twice.
#
# A version tag or a manual run. The Linux dev container cannot produce the
# MSI: WiX only runs on Windows.
#
# Default Cargo features are the private build (desktop, not online).
# Do not pass --features online.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust channel from rust-toolchain.toml
        id: rust-toolchain-file
        shell: bash
        run: echo "channel=$(sh tools/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: package-windows
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run tauri build
          npm run rename-msi
      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
