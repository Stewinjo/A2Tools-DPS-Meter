name: Packages

# Manual Windows MSI rebuild. Day-to-day pre-releases come from
# release-prerelease.yml on develop; promotion is release-promote.yml on main.
# See docs/GITFLOW.md.
#
# Default Cargo features are the private build. Do not pass --features online.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust channel from rust-toolchain.toml
        id: rust-toolchain-file
        shell: bash
        run: echo "channel=$(sh tools/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: package-windows
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      # WiX only accepts numeric pre-release/build ids. See tools/msi-version.sh.
      - name: WiX-safe MSI version
        shell: bash
        run: sh tools/stamp-wix-version.sh
      - name: Build
        run: |
          npm ci
          npm run tauri build
          npm run rename-msi
      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
